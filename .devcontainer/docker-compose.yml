# Dev container: clone https://github.com/Zhiwutian/photo-gallery and "Reopen in Container".
# Repo root is mounted at /workspace (works whether the folder is named photo-gallery or not).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photogallery
    ports:
      - "5432:5432"
      - "5173:5173"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    depends_on:
      db:
        condition: service_healthy
    network_mode: service:db
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      PHOTO_GALLERY_DEVCONTAINER: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/photogallery?sslmode=disable
      CORS_ORIGIN: http://localhost:5173
