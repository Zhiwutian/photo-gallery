# Local Postgres for development (host machine or any environment with Docker).
# Matches apps/api/.env.example — database name: photogallery
#
# Usage:
#   docker compose up -d --wait db
#   pnpm db:migrate
#
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photogallery
    volumes:
      - photogallery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  photogallery_pgdata:
